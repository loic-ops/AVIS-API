version: "3.9"

services:
  app:
    build: .
    container_name: avis-api-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - avis-net

  db:
    image: mysql:8.0
    container_name: avis-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: avis_db
      MYSQL_USER: avis_user
      MYSQL_PASSWORD: avis_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - avis-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: avis-api-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    networks:
      - avis-net

volumes:
  db_data:

networks:
  avis-net:
    driver: bridge
